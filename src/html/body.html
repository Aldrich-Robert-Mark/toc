  <script>
    getVariables();
    
    function displayButtons(showNext) {
      // This function toggles between a NEXT button and two buttons called GOTO & REDO. See the function NEXTACTION for the effects of the NEXT button.
      let nextButton = document.getElementById("nextButton");
      let gotoButton = document.getElementById("gotoButton");
      let redoButton = document.getElementById("redoButton");

      if (showNext) {
        nextButton.style = "display:true;";
        gotoButton.style = "display:none;";
        redoButton.style = "display:none;";
        document.getElementById("personID").disabled = false;
        document.getElementById("passcode").disabled = false;
        document.getElementById("userMessage").style = "display:none;"
      } else {
        nextButton.style = "display:none;";
        gotoButton.style = "display:true;";
        redoButton.style = "display:true;";
        document.getElementById("personID").disabled = true;
        document.getElementById("passcode").disabled = true;
      }
    }
    
    function nextAction() {
      ssPerson = document.getElementById("personID").value;
      ssPasscode = document.getElementById("passcode").value;
      if (checkIDs(ssPerson, ssPasscode)) {
        changePage("search");
      } else {
        document.getElementById("userMessage").style = "display:true;"
        document.getElementById("userMessageVerbage").innerHTML = "Information is unrecognized.";
        displayButtons(false);
      }
    }

  </script>
  <div id="bodyContents">
    <div id="inputForm" width="100%">
      <form onaction="input.php">
        <table>
          <tr>
            <th><label for="personID" id="useridlabel">Personal Identification</label></th>
            <td><input type="text" id="personID" size="30" maxlength="60" disabled></td>
            <script>
              if (ssPerson != null) {
                let fieldValue = document.getElementById("personID");
                fieldValue.value = ssPerson;
              }
            </script>
          </tr>
          <tr>
            <th><label for="passcode" id="passcodelabel">Passcode</label></th>
            <td>
                <input type="password" id="passcode" size="30" maxlength="60" disabled>
                <script>
                  if (ssPasscode != null) {
                    let fieldValue = document.getElementById("passcode");
                    fieldValue.value = ssPasscode;
                  }
                </script>
                <input type="button" id="viewPasscodeButton" onclick="revealPassword('passcode')" value="View">
            </td>
          </tr>
          <tr id="userMessage" style="display:none;">
            <td colspan="99"><p id="userMessageVerbage"></p></td>
          </tr>
        </table>
        <input type="submit" id="nextButton" value='Next'>
        <input type="button" id="gotoButton" onclick="changePage('start_registration')" value='Registration'>
        <input type="button" id="redoButton" onclick="displayButtons(true)" value='Redo'>
      </form>
    </div>
  </div>
  <script>
    displayButtons(true);
  </script>
